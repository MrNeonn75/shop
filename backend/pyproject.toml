[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brand-house-erp-backend"
version = "0.1.0"
description = "Production-oriented modular monolith retail ERP backend for Brand House"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.0",
    "gunicorn==23.0.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "email-validator==2.2.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.13.3",
    "redis==5.1.1",
    "arq==0.26.1",
    "structlog==24.4.0",
    "argon2-cffi==23.1.0",
    "typer==0.12.5",
    "rich==13.9.3",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "pyjwt[crypto]==2.9.0",
    "pyotp==2.9.0",
    "python-barcode>=0.16.1",
    "reportlab>=5.0.1",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "hypothesis==6.115.3",
    "polyfactory==2.16.2",
    "testcontainers[postgres]==4.8.2",
    "ruff==0.7.0",
    "mypy==1.13.0",
    "import-linter==2.1",
    "pre-commit==4.0.1",
    "pip-audit==2.7.3",
    "aiosqlite==0.20.0",
]

[project.scripts]
brand-house-admin = "scripts.seed:cli"
erp = "scripts.verify:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
]
ignore = [
    "B008",
    "RUF012",
    "RUF001",
    "RUF002",
    "RUF003",
    "TCH001",
    "TCH002",
    "TCH003",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "TCH001", "TCH002", "TCH003", "E501"]
"app/modules/*/tests/*" = ["ARG001", "ARG002", "TCH001", "TCH002", "TCH003", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "arq.*",
    "redis.*",
    "sentry_sdk.*",
    "testcontainers.*",
    "importlinter.*",
    "hypothesis.*",
    "sqlalchemy.dialects.postgresql.*",
    "openpyxl.*",
    "reportlab.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "app/modules"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/modules/*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85

